appId: ${MAESTRO_APP_ID}
---
# QA-ADMIN-02: Admin Tenants — search, segment filter, add tenant invite, status toggle
# Covers items 177-195 from the exhaustive inventory:
#   - Back button
#   - Property selector
#   - Search (debounced)
#   - Segments: All / Invited / Active / Inactive
#   - "Add Tenant" modal → fill email + business name → Send Invite
#   - Cancel add-tenant modal
#   - Tap active tenant row → disable
#   - Tap inactive tenant row → reactivate
#   - Empty state
#
# PREREQUISITE: Admin account has at least one property with tenants.

- launchApp:
    clearState: true

# Dev build: clearState resets launcher URL — open Metro bundle before login waits on "Log In".
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: ".*8081"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Would Like to Send You Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
      - tapOn: "Close"
      - waitForAnimationToEnd

- runFlow: ../subflows/login-admin.yaml
- assertVisible: "Admin Dashboard"

- extendedWaitUntil:
    visible:
      text: "Manage Tenants"
    timeout: 10000
- tapOn: "Manage Tenants"
- extendedWaitUntil:
    visible:
      text: "Tenants"
    timeout: 8000

# ── CASE 1: Property selector / selected property renders ─────────────────────
- extendedWaitUntil:
    visible:
      id: "property-selector"
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      text: "Loading tenants..."
    timeout: 10000

# ── CASE 2: Search ────────────────────────────────────────────────────────────
- tapOn:
    id: "search-input"
- inputText: "test"
- waitForAnimationToEnd
- eraseText: 100
- hideKeyboard
- waitForAnimationToEnd

# ── CASE 3: Segment filter ────────────────────────────────────────────────────
- tapOn: "Invited"
- waitForAnimationToEnd
- tapOn: "Active"
- waitForAnimationToEnd
- tapOn: "Inactive"
- waitForAnimationToEnd
- tapOn: "All"
- waitForAnimationToEnd

# ── CASE 4: Add Tenant modal — Cancel ────────────────────────────────────────
- tapOn: "Add Tenant"
- extendedWaitUntil:
    visible:
      text: "Add Tenant"
    timeout: 6000
- tapOn: "Cancel"
- assertNotVisible: "Send Invite"

# ── CASE 5: Add Tenant modal — Send Invite (invites new tenant) ───────────────
- tapOn: "Add Tenant"
- extendedWaitUntil:
    visible:
      text: "Send Invite"
    timeout: 6000
- tapOn:
    id: "tenant-invite-email"
- inputText: "qa-invite-test@mailinator.com"
- tapOn:
    id: "tenant-invite-business-name"
- inputText: "QA Test Business"
- tapOn:
    id: "tenant-invite-category"
- inputText: "technology"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "modal-action-send-invite"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "modal-action-send-invite"
    commands:
      - tapOn:
          id: "modal-action-send-invite"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "modal-action-send-invite"
    commands:
      - tapOn:
          id: "modal-action-cancel"
- extendedWaitUntil:
    notVisible:
      id: "modal-overlay"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Tenants"
    timeout: 10000

# ── CASE 6: Status toggle — disable then reactivate the canonical tenant ─────
- tapOn:
    id: "search-input"
- eraseText: 100
- inputText: "tenant1"
- pressKey: Enter
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "tenant-row"
    timeout: 10000
- tapOn:
    id: "tenant-row"
    index: 0
- waitForAnimationToEnd
- tapOn: "Inactive"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "tenant-row"
    timeout: 10000
- tapOn:
    id: "tenant-row"
    index: 0
- waitForAnimationToEnd
- tapOn: "All"
- waitForAnimationToEnd

# ── CASE 7: Back button ───────────────────────────────────────────────────────
- tapOn:
    id: "back-btn"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Admin Dashboard"
    commands:
      - tapOn:
          point: "6%,10%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Admin Dashboard"
    timeout: 8000

# Log out
- tapOn:
    id: "admin-logout-btn"
- assertVisible: "Are you sure you want to log out?"
- tapOn:
    text: "Log Out"
    index: 1
- extendedWaitUntil:
    visible:
      text: "Log In"
    timeout: 8000
