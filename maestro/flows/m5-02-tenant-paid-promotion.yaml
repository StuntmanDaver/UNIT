appId: ${MAESTRO_APP_ID}
---
# M5-02: Tenant-paid promotion happy path
# Tenant logs in → submits a promotion → picks a tier → pays via Stripe
# test card → returns to "Awaiting Review" state.
#
# Requires: Stripe test mode, dev Supabase project with at least one
# active price tier, dev Edge Function `create-promotion-checkout-session`
# deployed with STRIPE_SECRET_KEY (test) set.

- launchApp
- runFlow: ../subflows/open-dev-client-bundle.yaml
- runFlow: ../subflows/login-tenant1.yaml

# Navigate to Promotions tab and start a new promotion
- tapOn:
    id: "tab-promotions"
- extendedWaitUntil:
    visible:
      id: "fab-create-promotion"
    timeout: 12000
- runFlow:
    when:
      notVisible:
        id: "fab-create-promotion"
    commands:
      - tapOn:
          id: "tab-promotions"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "fab-create-promotion"
    timeout: 12000

- tapOn:
    id: "fab-create-promotion"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Promote My Business"
    commands:
      - tapOn:
          id: "fab-create-promotion"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Promote My Business"
    timeout: 8000

# Fill the form with deterministic content. Inputs use stable testIDs to
# avoid the iOS Text-label / TextInput accessibility-label collision.
- tapOn:
    id: "promotion-headline"
- inputText: "M5-02 Paid Test Promotion"
- tapOn:
    id: "promotion-description"
- inputText: "Maestro tenant-paid promotion happy-path verification."
- runFlow: ../subflows/dismiss-android-keyboard-if-present.yaml
# hideKeyboard is flaky on iOS 18.6 + Maestro 2.4. Tap the (non-interactive)
# header text to dismiss the keyboard instead.
- tapOn: "Promote My Business"

# Pick Start Date and End Date. The iOS picker exposes a stable Done testID;
# tapping it commits start, advances to end, then commits end.
- tapOn:
    id: "promotion-start-date"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "date-picker-done"
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 65%"
      - tapOn:
          id: "date-picker-done"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "date-picker-done"
    commands:
      - swipe:
          start: "50%, 80%"
          end: "50%, 65%"
      - tapOn:
          id: "date-picker-done"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "promotion-end-date"
    commands:
      - tapOn:
          id: "promotion-end-date"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
      - waitForAnimationToEnd
- waitForAnimationToEnd

# iOS shows a one-time QuickPath keyboard tutorial after the first
# inputText. Dismiss it if it appears; its Continue button label collides
# with our "Continue to Payment" so leaving it up confuses tapOn.
- runFlow:
    when:
      visible: "Speed up your typing"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

# Continue to Payment is sticky above the platform safe area so Android and
# iOS can use the same stable accessibility selector.
- tapOn:
    id: "promotion-submit"

# Tenant lands on the pending-payment screen
- extendedWaitUntil:
    visible:
      text: "Pending Payment"
    timeout: 10000

# Pick the first (cheapest) available tier. The app preselects the cheapest
# active tier, but tapping keeps this flow explicit.
- tapOn:
    id: "promotion-tier-0"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: "Pay Now"
          direction: DOWN
          centerElement: false
          timeout: 30000
          visibilityPercentage: 60
      - tapOn: "Pay Now"
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: "pending-payment-pay-now"
          direction: DOWN
          centerElement: true
      - tapOn: "Pay Now"

# iOS shows a native ASWebAuthenticationSession consent prompt the first
# time `openAuthSessionAsync` opens stripe.com. Pay Now triggers a
# checkout-session RPC then `openAuthSessionAsync`, so the prompt appears
# ~1-2s after the tap. Do not poll the view hierarchy while this prompt
# is animating; Maestro/XCUITest intermittently throws
# kAXErrorInvalidUIElement. Tap the native Continue button by coordinate.
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Confirm it’s you"
    commands:
      - tapOn: "Pay without Link"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Confirm it's you"
    commands:
      - tapOn: "Pay without Link"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Pay without Link"
    commands:
      - tapOn: "Pay without Link"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Enter 000000 to continue"
    commands:
      - inputText: "000000"
      - waitForAnimationToEnd
- waitForAnimationToEnd

# Stripe Checkout opens in the in-app browser. Card field labels are
# Stripe-controlled so this section is the most fragile — adjust
# selectors if Stripe updates their Checkout UI.
- extendedWaitUntil:
    visible:
      text: "Payment method"
    timeout: 60000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "^Card$"
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Card"
- extendedWaitUntil:
    visible:
      text: "Card number"
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Card number"
      - inputText: "4242424242424242"
      - pressKey: Enter
      - inputText: "1230"
      - pressKey: Enter
      - inputText: "123"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Card number"
      - inputText: "4242424242424242"
      - tapOn:
          text: "MM / YY"
      - inputText: "1230"
      - tapOn:
          text: "CVC"
      - inputText: "123"
- tapOn:
    text: "Cardholder name"
- inputText: "Maestro Test"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Allow Gboard to record audio?"
          commands:
            - tapOn: "Don’t allow"
            - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "90%,67%"
- waitForAnimationToEnd

# Stripe now requires a ZIP code for US card payments and enables Link
# "save my information" by default. Fill ZIP, uncheck Link save, then pay.
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "50%,82%"
          end: "50%,48%"
      - waitForAnimationToEnd
      - tapOn: "ZIP"
      - inputText: "10001"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Phone number"
          commands:
            - tapOn: "Phone number"
            - eraseText: 20
            - inputText: "2015550123"
            - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "^Pay$"
          direction: DOWN
          centerElement: false
          timeout: 30000
          visibilityPercentage: 60
      - tapOn: "^Pay$"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "89%,63%"
      - waitForAnimationToEnd
      - swipe:
          start: "50%,80%"
          end: "50%,30%"
      - waitForAnimationToEnd
      - tapOn: "Save my information for faster checkout"
      - waitForAnimationToEnd
      # Stripe exposes several "Pay" labels (Apple Pay, Link copy, final CTA).
      # At this scroll position the final blue Pay button is centered near the
      # lower portion of the viewport, so tap it by coordinate.
      - tapOn:
          point: "50%,82%"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
      - waitForAnimationToEnd

# Stripe redirects to unit://promotions; the in-app browser dismisses
# and the screen polls payment_status. On success the screen header
# becomes "Awaiting Review".
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Awaiting Review"
          timeout: 60000
      - assertVisible: "Payment received. Admins will review your promotion shortly."
      - scrollUntilVisible:
          element:
            id: "pending-payment-save-later"
          direction: DOWN
          centerElement: true
          timeout: 20000
      - tapOn:
          id: "pending-payment-save-later"
      - assertVisible: "Promotions"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "M5-02 Paid Test Promotion"
          timeout: 60000
      - tapOn:
          id: "tab-promotions"
      - assertVisible: "Promotions"

- runFlow: ../subflows/logout.yaml
