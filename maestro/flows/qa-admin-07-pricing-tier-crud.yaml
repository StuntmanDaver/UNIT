appId: ${MAESTRO_APP_ID}
---
# QA-ADMIN-07: Admin Pricing — create, deactivate, and modal smoke
# Covers items 237-246.
#
# What this flow verifies:
#   - Admin can navigate to Promotion Pricing from the dashboard.
#   - Seeded tiers render in the list.
#   - Add-tier modal can be canceled.
#   - Admin can create a tier.
#   - Admin can deactivate the created tier.
#   - Logout from the screen works.

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: ".*8081"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Would Like to Send You Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
      - tapOn: "Close"
      - waitForAnimationToEnd

- runFlow: ../subflows/login-admin.yaml
- assertVisible: "Admin Dashboard"

- tapOn: "Promotion Pricing"
- extendedWaitUntil:
    visible:
      text: "Set prices tenants pay for promotions"
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      text: "Loading"
    timeout: 8000
- assertVisible:
    id: "btn-add-price-tier"

- tapOn:
    id: "btn-add-price-tier"
- waitForAnimationToEnd
- assertVisible:
    id: "modal-title"
- assertVisible:
    id: "pricing-tier-name"
- tapOn:
    id: "modal-action-cancel"
- assertNotVisible:
    id: "modal-overlay"

# ── CASE 2: Create a new tier ────────────────────────────────────────────────
- tapOn:
    id: "btn-add-price-tier"
- waitForAnimationToEnd
- assertVisible:
    id: "pricing-tier-name"
- tapOn:
    id: "pricing-tier-name"
- inputText: "QA E2E Admin Tier"
- tapOn:
    id: "pricing-tier-duration"
- inputText: "3"
- tapOn:
    id: "pricing-tier-price"
- inputText: "0.99"
- runFlow: ../subflows/dismiss-android-keyboard-if-present.yaml
- tapOn:
    id: "modal-action-save"
- extendedWaitUntil:
    visible:
      text: "Tier added"
    timeout: 12000
- extendedWaitUntil:
    visible:
      text: "QA E2E Admin Tier"
    timeout: 12000

# ── CASE 3: Deactivate created tier ──────────────────────────────────────────
- tapOn:
    id: "pricing-tier-deactivate-qa-e2e-admin-tier"
- extendedWaitUntil:
    visible:
      text: "Deactivate Tier"
    timeout: 8000
- runFlow:
    when:
      visible: "Deactivate"
    commands:
      - tapOn:
          point: "68%,59%"
- extendedWaitUntil:
    notVisible:
      text: "Deactivate Tier"
    timeout: 8000
- extendedWaitUntil:
    visible:
      text: "Inactive"
    timeout: 12000
