appId: ${MAESTRO_APP_ID}
---
# QA-ADMIN-06: Admin New External Promotion — full form submit and cancel
# Covers items 228-236 from the exhaustive inventory:
#   - Property selector "Target Property *"
#   - Business Name *, Headline *, Description * (required)
#   - CTA Label / CTA URL optional fields
#   - Start Date / End Date pickers (iOS modal)
#   - Create → toast "External promotion created" + back
#   - Cancel → back
#
# Field labels verified from source (new-external.tsx):
#   "Business Name *", "Headline *", "Description *", "CTA Label", "CTA URL"
# Date pickers: Pressables show "Select" initially → tap by visible text
# Submit button: "Create Promotion"
# Success toast: text1 "External promotion created"

- launchApp:
    clearState: true

# Dev build: clearState resets launcher URL — open Metro bundle before login waits on "Log In".
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: ".*8081"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Would Like to Send You Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
      - tapOn: "Close"
      - waitForAnimationToEnd

- runFlow: ../subflows/login-admin.yaml
- assertVisible: "Admin Dashboard"

- extendedWaitUntil:
    visible:
      id: "property-selector"
    timeout: 10000

- extendedWaitUntil:
    visible:
      text: "Manage Promotions"
    timeout: 10000
- tapOn: "Manage Promotions"
- extendedWaitUntil:
    visible:
      text: "All"
    timeout: 8000

# ── CASE 1: Cancel new external promo ────────────────────────────────────────
- tapOn:
    id: "new-external-promotion-btn"
- extendedWaitUntil:
    visible:
      text: "New External Promotion"
    timeout: 8000
- tapOn:
    id: "back-btn"
- assertVisible: "All"

# ── CASE 2: Create new external promo ─────────────────────────────────────────
- tapOn:
    id: "new-external-promotion-btn"
- extendedWaitUntil:
    visible:
      text: "New External Promotion"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "property-selector"
    timeout: 10000
- tapOn:
    id: "external-promo-business-name"
- inputText: "QA E2E External Business"
- tapOn:
    id: "external-promo-headline"
- inputText: "QA E2E External Offer"
- tapOn:
    id: "external-promo-description"
- inputText: "Automated admin external promotion verification."
- runFlow: ../subflows/dismiss-android-keyboard-if-present.yaml
- scrollUntilVisible:
    element:
      id: "external-promo-start-date"
    direction: DOWN
    centerElement: true
- assertNotVisible: "Select"
- waitForAnimationToEnd
- tapOn:
    id: "external-promo-create"
- extendedWaitUntil:
    visible:
      text: "External promotion created"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "All"
    timeout: 8000

# ── CASE 3: External segment renders seeded/new external promo ────────────────
- tapOn:
    text: "External"
- waitForAnimationToEnd
- assertVisible:
    id: "promo-card"
