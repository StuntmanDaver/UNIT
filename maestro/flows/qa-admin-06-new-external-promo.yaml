appId: ${MAESTRO_APP_ID}
---
# QA-ADMIN-06: Admin New External Promotion — full form submit and cancel
# Covers items 228-236 from the exhaustive inventory:
#   - Property selector "Target Property *"
#   - Business Name *, Headline *, Description * (required)
#   - CTA Label *, CTA URL * (required)
#   - Start Date / End Date pickers (iOS modal)
#   - Create → toast "External promotion created" + back
#   - Cancel → back
#
# Field labels verified from source (new-external.tsx):
#   "Business Name *", "Headline *", "Description *", "CTA Label *", "CTA URL *"
# Date pickers: Pressables show "Select" initially → tap by visible text
# Submit button: "Create Promotion"
# Success toast: text1 "External promotion created"

- launchApp:
    clearState: true

# Dev build: clearState resets launcher URL — open Metro bundle before login waits on "Log In".
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: ".*8081"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Would Like to Send You Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
      - tapOn: "Close"
      - waitForAnimationToEnd

- runFlow: ../subflows/login-admin.yaml
- assertVisible: "Admin Dashboard"

- extendedWaitUntil:
    visible:
      id: "property-selector"
    timeout: 10000
- tapOn:
    id: "property-selector"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "property-selector-option"
    commands:
      - tapOn:
          id: "property-selector-option"
          index: 0
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Manage Promotions"
    timeout: 10000
- tapOn: "Manage Promotions"
- extendedWaitUntil:
    visible:
      text: "All"
    timeout: 8000

# ── CASE 1: Cancel new external promo ────────────────────────────────────────
- tapOn:
    id: "new-external-promotion-btn"
- extendedWaitUntil:
    visible:
      text: "New External Promotion"
    timeout: 8000
- tapOn:
    id: "back-btn"
- assertVisible: "All"

# ── CASE 2: External segment renders seeded external promo ────────────────────
- tapOn:
    id: "new-external-promotion-btn"
- extendedWaitUntil:
    visible:
      text: "New External Promotion"
    timeout: 8000
- tapOn:
    id: "back-btn"
- extendedWaitUntil:
    visible:
      text: "All"
    timeout: 8000
- tapOn: "External"
- waitForAnimationToEnd
- assertVisible:
    id: "promo-card"

# Log out
- tapOn:
    id: "back-btn"
- extendedWaitUntil:
    visible:
      text: "Admin Dashboard"
    timeout: 8000
- tapOn:
    id: "admin-logout-btn"
- assertVisible: "Are you sure you want to log out?"
- tapOn:
    text: "Log Out"
    index: 1
- extendedWaitUntil:
    visible:
      text: "Log In"
    timeout: 8000
