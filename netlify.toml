[build]
  publish = "website"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/portal"
  to = "https://unit-portal-one.vercel.app"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
